<line x1="1140" y1="190" x2="820" y2="250" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="405" fill="#8b949e" font-size="12" font-weight="normal" font-family="Menlo, Consolas, monospace">Oracle: docker compose config, create and run -d + docker inspect (Docker Compose 2.32.4)</text>
